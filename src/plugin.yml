name: SusSMP
version: 1.9.0
main: id.kuru.sussmp.SusPlugin
api-version: '1.21'
description: Social deduction ala Among Us - 15 altar task item, meeting bell, vote chat
commands:
  sus:
    description: Perintah utama SusSMP
    usage: /sus <add|remove|start|stop|meetingtime|cooldown|impostors|setroom|altar|reload>
  vote:
    description: Buka GUI voting (hanya saat meeting)
    usage: /vote
permissions:
  sus.admin:
    description: Kelola game SusSMP
    default: op
